<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers For You</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<input type="checkbox" id="heartOpen">
<input type="checkbox" id="letterOpen">

<div class="scene">

    <div class="stars"></div>
    <div class="moon"></div>

    <h1>Flowers For You</h1>

    <!-- FIRST HEART -->
    <label for="heartOpen" class="heart-button">
        <div class="heart"></div>
    </label>

    <!-- FLOWER BOUQUET -->
    <div class="bouquet">

        <div class="flower flower1">
            <div class="bud"></div>
            <div class="stem"></div>
        </div>

        <div class="flower flower2">
            <div class="bud"></div>
            <div class="stem"></div>
        </div>

        <div class="flower flower3">
            <div class="bud"></div>
            <div class="stem"></div>
        </div>

        <div class="flower flower4">
            <div class="bud"></div>
            <div class="stem"></div>
        </div>

        <div class="flower flower5">
            <div class="bud"></div>
            <div class="stem"></div>
        </div>

        <div class="flower flower6">
            <div class="bud"></div>
            <div class="stem"></div>
        </div>

        <div class="flower flower7">
            <div class="bud"></div>
            <div class="stem"></div>
        </div>

        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="leaf leaf3"></div>
        <div class="leaf leaf4"></div>
        <div class="leaf leaf5"></div>

        <!-- WRAPPER -->
        <div class="wrapper">

            <div class="ribbon"></div>

            <label for="letterOpen" class="envelope">

                <div class="envelope-back"></div>

                <div class="envelope-paper"></div>

                <div class="envelope-front"></div>

                <div class="envelope-flap"></div>

                <div class="small-heart">♥️</div>

            </label>

        </div>

    </div>

    <!-- LETTER -->
    <div class="letter">

        <div class="letter-paper">

            <div class="letter-border">

                <h2>Bo Dalya Juanakam ❤️</h2>

                <p>
                    Zormm Xoshaweyy Dalyakam Xua Gyan
                     Tom Le Nasenet U Bmenyt Bomm 🧸💕,
                </p>

                <div class="cute-picture">
                    ♡
                </div>

                <p class="bottom-text">
                    Mn Tom Baw Shewaya Xoshawet Ka Hayt 🌚.
                </p>

                <div class="signature">
                    Chaw Juanakam ♡
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
